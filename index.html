function computeStateHash() {
  try {
    return [
      app.santri.length,
      app.guru.length,
      app.users.length,
      app.kas.length,
      app.masukan.length,
      app.logWA.length,
      Object.keys(app.pencapaian).length,
      Object.keys(app.presensiSantri).length,
      Object.keys(app.presensiGuru).length,
      Object.keys(app.mutabaah).length,
      (app.santri[0] && app.santri[0].id) || "",
      (app.santri[app.santri.length - 1] && app.santri[app.santri.length - 1].id) || "",
      (app.masukan[0] && app.masukan[0].id) || "",
      (app.kas[0] && app.kas[0].id) || ""
    ].join("|");
  } catch (e) { return ""; }
}

function startAutoSync() {
  stopAutoSync();
  if (!app.currentUser) return;
  if (!SYNC.url || SYNC.url.indexOf("GANTI_") === 0) return;
  AUTO_SYNC.timer = setInterval(function() {
    if (document.hidden) return;
    if (AUTO_SYNC.inProgress) return;
    if (PUSH_QUEUE.timer) return;
    if (Object.keys(PUSH_QUEUE.pending).length > 0) return;
    if (SYNC.status === "loading") return;
    AUTO_SYNC.inProgress = true;
    pullSilentAndNotify().finally(function() { AUTO_SYNC.inProgress = false; });
  }, AUTO_SYNC.intervalMs);
}

function stopAutoSync() {
  if (AUTO_SYNC.timer) { clearInterval(AUTO_SYNC.timer); AUTO_SYNC.timer = null; }
}

function pullSilentAndNotify() {
  var beforeHash = computeStateHash();
  return fetch(SYNC.url + "?t=" + Date.now(), { redirect: "follow" })
    .then(function(res) { return checkJSONResponse(res, "auto-poll"); })
    .then(function(resp) {
      var data = (resp && resp.data) ? resp.data : resp;
      if (!data) throw new Error("Response kosong");
      applyServerDataToApp(data);
      persist();
      SYNC.status = "ok";
      SYNC.lastSync = nowISO();
      persistSync();
      renderSyncBadge();
      var afterHash = computeStateHash();
      if (beforeHash !== afterHash) {
        addSyncLog("auto-poll", "ok", "Perubahan dari device lain");
        renderKeepScroll();
        showToast("🔄 Data diperbarui dari server", "info");
      }
      return true;
    })
    .catch(function(e) {
      SYNC.status = "error";
      addSyncLog("auto-poll", "error", e.message || String(e));
      renderSyncBadge();
      return false;
    });
}

function formatDate(input) {
  if (!input) return "-";
  if (typeof input === "string" && /^\d{2}\/\d{2}\/\d{4}$/.test(input)) return input;
  try {
    var d = new Date(input);
    if (isNaN(d.getTime())) return String(input);
    return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
  } catch (e) { return String(input); }
}
function isoToDisplay(iso) {
  if (!iso) return "-";
  var s = String(iso);
  if (s.indexOf("T") > 0) s = s.split("T")[0];
  var p = s.split("-");
  if (p.length === 3) return p[2] + "/" + p[1] + "/" + p[0];
  return formatDate(iso);
}
function hitungUmur(tglLahir) {
  if (!tglLahir) return "-";
  var d = new Date(tglLahir), now = new Date();
  if (isNaN(d.getTime())) return "-";
  var th = now.getFullYear() - d.getFullYear();
  var bl = now.getMonth() - d.getMonth();
  var hr = now.getDate() - d.getDate();
  if (hr < 0) { bl--; hr += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (bl < 0) { th--; bl += 12; }
  if (th < 0) return "0 bln";
  if (th === 0) return bl + " bln " + hr + " hr";
  return th + " th " + bl + " bln";
}
function normalizeDateKey(t) {
  if (!t) return "";
  var s = String(t).trim();
  if (s.indexOf("T") > 0) s = s.substring(0, s.indexOf("T"));
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) { var p = s.split("/"); return p[2] + "-" + p[1] + "-" + p[0]; }
  return s;
}
function nextIdMax(arr, prefix) {
  var nums = (arr || []).filter(function(x){ return x && x.id && String(x.id).indexOf(prefix) === 0; })
    .map(function(x){ return parseInt(String(x.id).replace(prefix, ""), 10); })
    .filter(function(n){ return !isNaN(n); });
  var max = nums.length > 0 ? Math.max.apply(null, nums) : 0;
  return prefix + String(max + 1).padStart(3, "0");
}

    if (s && s.kelas) return String(s.kelas).trim();

  if (u.pendingSantri && u.pendingSantri.kelas) {
    return String(u.pendingSantri.kelas).trim();
  }
  return "";

function countPendingApproval() {
  if (!app.currentUser) return 0;
  if (app.currentUser.role === "admin") {
    return app.users.filter(function(u) { return u.status === "pending"; }).length;
  }
  if (app.currentUser.role === "walikelas") {
    var myKelas = String(app.currentUser.kelas || "").trim();
    if (!myKelas) return 0;
    return app.users.filter(function(u) {
      if (u.status !== "pending") return false;
      if (u.role !== "walisantri") return false;
      return getTargetKelasForUser(u) === myKelas;
    }).length;

  return 0;
}

function checkMidnightRollover() {
  var fresh = todayISO();
  if (fresh !== TODAY_ISO) {
    var wasOnToday = (app.presensiDate === TODAY_ISO);
    var wasOnTodayMut = (app.mutabaahDate === TODAY_ISO);
    TODAY_ISO = fresh;

function flattenPresensi(isGuru) {

    var dayData = store[tgl];

      if (!r || typeof r !== "object") return;
      arr.push({
        tanggal: normalizeDateKey(tgl), id: id, nama: r.nama || "", kelas: r.kelas || "",
        status: r.status || "hadir", inputBy: r.inputBy || "", timestamp: r.timestamp || ""
      });
    });
  });
  return arr;
}
function nestPresensi(arr) {
  var out = {};
  (arr || []).forEach(function(r) {
    var tgl = normalizeDateKey(r.tanggal);
    var id = String(r.id || "").trim();
    if (!tgl || !id) return;
    if (!out[tgl]) out[tgl] = {};
    out[tgl][id] = { nama: r.nama || "", kelas: r.kelas || "", status: r.status || "hadir", inputBy: r.inputBy || "", timestamp: r.timestamp || "" };
  });
  return out;
}

function checkJSONResponse(res, context) {
  var ct = (res.headers.get("content-type") || "").toLowerCase();
  if (ct.indexOf("application/json") !== -1) return res.json();
  return res.text().then(function(txt) {
    var preview = txt.substring(0, 200).replace(/\s+/g, " ").trim();
    var hint = "";
    if (txt.indexOf("<!DOCTYPE") === 0 || txt.indexOf("<html") !== -1) hint = " Server balas HTML. Cek Apps Script deployment.";
    else if (res.status === 401 || res.status === 403) hint = " Akses ditolak.";
    throw new Error("[" + context + "]" + hint + " Preview: " + preview);
  });
}

function mapUserFromServer(u) {
  var st = String(u.status || "approved").trim().toLowerCase();
  if (st !== "pending" && st !== "rejected" && st !== "approved") st = "approved";
  return {
    username: String(u.username || "").trim(),
    password: String(u.password || "").trim(),
    name: String(u.name || "").trim(),
    role: String(u.role || "").trim(),
    kelas: String(u.kelas || "").trim(),
    santriId: String(u.santriId || "").trim(),
    email: String(u.email || "").trim().toLowerCase(),

function applyServerDataToApp(data) {
  var pendingActions = Object.keys(PUSH_QUEUE.pending);
  var hasPending = function(action) {
    return pendingActions.indexOf(action) !== -1 || PUSH_QUEUE.timer !== null;
  };

  if (data.santri && data.santri.length && !hasPending("sync_santri"))
    app.santri = data.santri;
  if (data.guru && data.guru.length && !hasPending("sync_guru"))
    app.guru = data.guru;
  if (data.users && data.users.length > 0 && !hasPending("sync_users")) {
    app.users = data.users.map(mapUserFromServer).filter(function(u) { return u.username && u.password; });
  }
  ensureAdminExists();
  if (data.pencapaian && Object.keys(data.pencapaian).length && !hasPending("sync_pencapaian"))
    app.pencapaian = data.pencapaian;
  if (data.presensiSantri && Array.isArray(data.presensiSantri) && !hasPending("sync_presensi_santri"))
    app.presensiSantri = nestPresensi(data.presensiSantri);
  if (data.presensiGuru && Array.isArray(data.presensiGuru) && !hasPending("sync_presensi_guru"))
    app.presensiGuru = nestPresensi(data.presensiGuru);
  if (data.kas && Array.isArray(data.kas) && !hasPending("sync_kas"))
    app.kas = data.kas;
  if (data.logWA && Array.isArray(data.logWA) && !hasPending("sync_logwa"))
    app.logWA = data.logWA;
  if (data.masukan && Array.isArray(data.masukan) && !hasPending("sync_masukan"))
    app.masukan = data.masukan;
  if (data.mutabaah && typeof data.mutabaah === "object" && !Array.isArray(data.mutabaah) && !hasPending("sync_mutabaah"))
    app.mutabaah = data.mutabaah;
}

function autoPush(action, payload) {
  if (!SYNC.autoPush) return;
  if (!SYNC.url || SYNC.url.indexOf("GANTI_") === 0) return;
  PUSH_QUEUE.pending[action] = payload;
  SYNC.status = "loading";
  renderSyncBadge();
  if (PUSH_QUEUE.timer) clearTimeout(PUSH_QUEUE.timer);
  PUSH_QUEUE.timer = setTimeout(flushPushQueue, PUSH_QUEUE.debounceMs);
}
function flushPushQueue() {
  PUSH_QUEUE.timer = null;
  var actions = Object.keys(PUSH_QUEUE.pending);
  if (actions.length === 0) return;
  var snapshot = {};
  actions.forEach(function(a) { snapshot[a] = PUSH_QUEUE.pending[a]; });
  PUSH_QUEUE.pending = {};
  var chain = Promise.resolve();
  var successCount = 0, failCount = 0, lastError = "";
  actions.forEach(function(action) {
    chain = chain.then(function() {
      return syncPush(action, snapshot[action], false)
        .then(function(ok) { if (ok === false) failCount++; else successCount++; })
        .catch(function(err) { failCount++; lastError = err && err.message ? err.message : String(err); });
    });
  });
  chain.then(function() {
    if (failCount === 0) {
      SYNC.status = "ok"; PUSH_QUEUE.retries = 0;
      addSyncLog("auto-push", "ok", successCount + " sheet terupdate");
      showToast("✅ " + successCount + " data tersinkron", "ok");
    } else {
      SYNC.status = "error"; addSyncLog("auto-push", "error", failCount + " gagal");
      if (PUSH_QUEUE.retries < PUSH_QUEUE.maxRetries) {
        PUSH_QUEUE.retries++;
        var delay = 2000 * PUSH_QUEUE.retries;
        showToast("⚠️ Sync gagal, retry " + (delay/1000) + "s", "info");
        Object.keys(snapshot).forEach(function(a) { PUSH_QUEUE.pending[a] = snapshot[a]; });
        setTimeout(flushPushQueue, delay);
      } else {
        showToast("❌ Sync gagal: " + (lastError || failCount + " error"), "err");
        PUSH_QUEUE.retries = 0;
      }
    }
    renderSyncBadge();
  });
}

function syncPush(action, payload, silent) {
  if (!SYNC.url || SYNC.url.indexOf("GANTI_") === 0) return Promise.resolve(false);
  SYNC.status = "loading"; renderSyncBadge();
  return fetch(SYNC.url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: action, payload: payload }),
    redirect: "follow"
  })
    .then(function(res) { return checkJSONResponse(res, "push:" + action); })
    .then(function(data) {
      if (!data.ok) throw new Error(data.error || "Response tidak OK");
      SYNC.status = "ok"; SYNC.lastSync = nowISO(); persistSync();
      var msg = "";
      if (data && data.upsert) {
        msg = "(+" + (data.upsert.added || 0) + " baru)";
      }
      addSyncLog("push:" + action, "ok", msg);
      if (!silent) showToast("✅ " + action + " tersinkron " + msg, "ok");
      return true;
    })
    .catch(function(e) {
      SYNC.status = "error"; addSyncLog("push:" + action, "error", e.message);
      if (!silent) showToast("❌ Gagal push " + action + ": " + e.message, "err");
      return false;
    })
    .finally(function() { renderSyncBadge(); });
}

function renderSyncBadge() {
  var el = document.getElementById("sync-badge");
  if (!el) return;
  var color = "bg-gray-400", text = "◦ Siap";
  var pc = Object.keys(PUSH_QUEUE.pending).length;
  if (pc > 0) { color = "bg-amber-400"; text = "⟳ " + pc + " pending..."; }

// ============================================================
// AUTO UPDATE — cek versi terbaru & prompt user
// ============================================================
function compareVersion(a, b) {
  var pa = String(a || "0").split(".").map(function(x) { return parseInt(x, 10) || 0; });
  var pb = String(b || "0").split(".").map(function(x) { return parseInt(x, 10) || 0; });
  var len = Math.max(pa.length, pb.length);
  for (var i = 0; i < len; i++) {
    var x = pa[i] || 0, y = pb[i] || 0;
    if (x > y) return 1;
    if (x < y) return -1;
  }
  return 0;
}

function getVersionCheckUrl() {
  var base = SYNC.url || SYNC_URL_DEFAULT;
  if (!base || base.indexOf("GANTI_") === 0) return "";
  var sep = base.indexOf("?") !== -1 ? "&" : "?";
  return base + sep + "action=version&t=" + Date.now();
}

function checkForUpdate(silent) {
  if (UPDATE.checking) return Promise.resolve(false);
  var url = getVersionCheckUrl();
  if (!url) return Promise.resolve(false);

  UPDATE.checking = true;
  UPDATE.lastCheck = Date.now();
  if (!silent) showToast("🔎 Memeriksa versi terbaru...", "info");

  return fetch(url, { redirect: "follow" })
    .then(function(res) { return checkJSONResponse(res, "version-check"); })
    .then(function(resp) {
      var data = (resp && resp.data) ? resp.data : resp;
      if (!data || !data.version) throw new Error("Response versi tidak valid");

      var latest = String(data.version);
      var cmp = compareVersion(latest, APP_VERSION);

      if (cmp > 0) {
        UPDATE.available = true;
        UPDATE.latestVersion = latest;
        UPDATE.notes = data.notes || "";
        UPDATE.releasedAt = data.releasedAt || "";
        UPDATE.appUrl = data.appUrl || "";
        UPDATE.error = "";
        if (!silent) showToast("✨ Versi " + latest + " tersedia!", "ok");
      } else {
        UPDATE.available = false;
        UPDATE.latestVersion = latest;
        UPDATE.notes = data.notes || "";
        UPDATE.releasedAt = data.releasedAt || "";
        UPDATE.appUrl = data.appUrl || "";
        UPDATE.error = "";
        if (!silent) showToast("✅ Aplikasi sudah versi terbaru (" + APP_VERSION + ")", "ok");
      }
      render();
      return true;
    })
    .catch(function(e) {
      UPDATE.error = e.message || String(e);
      console.warn("[version-check]", e);
      if (!silent) showToast("⚠️ Gagal cek versi: " + (e.message || e), "err");
      return false;
    })
    .finally(function() { UPDATE.checking = false; });
}

function applyUpdate() {
  if (!UPDATE.available) return;
  saveLS("tpq_version_seen_v1", UPDATE.latestVersion);

  try { persist(); } catch (e) {}
  if (Object.keys(PUSH_QUEUE.pending).length > 0) {
    try { flushPushQueue(); } catch (e) {}
  }

  showToast("🚀 Memuat versi " + UPDATE.latestVersion + "...", "ok");

  setTimeout(function() {
    var base = location.href.split("?")[0].split("#")[0];
    var bust = "_v=" + Date.now();
    location.href = base + "?" + bust;
  }, 500);
}

function snoozeUpdate() {
  if (!UPDATE.available) return;
  saveLS(VERSION_SNOOZE_KEY, { version: UPDATE.latestVersion, at: Date.now() });
  UPDATE.available = false;
  render();
  showToast("⏰ Pengingat update ditunda 24 jam", "info");
}
function dismissUpdateBanner() { UPDATE.available = false; render(); }

function renderUpdateBanner() {
  if (!UPDATE.available) return "";
  return '<div class="fixed top-0 left-0 right-0 z-[105] safe-top" style="animation:slideDown .35s ease">'
    + '<div class="mx-auto max-w-[1100px] p-3">'
    +   '<div class="bg-gradient-to-r from-teal-600 to-cyan-600 text-white rounded-2xl shadow-2xl p-3 md:p-4 flex items-start gap-3 flex-wrap">'
    +     '<div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center shrink-0">'

    +     '<div class="flex-1 min-w-[200px]">'

    +         '<span class="px-2 py-0.5 rounded-full bg-white/20 text-[10px] font-bold">v' + escapeHTML(UPDATE.latestVersion) + '</span>'
    +         (UPDATE.releasedAt ? '<span class="text-[10px] opacity-80">• ' + escapeHTML(UPDATE.releasedAt) + '</span>' : '')
    +       '</div>'
    +       '<div class="text-[11px] opacity-90 mt-0.5">' + (UPDATE.notes ? escapeHTML(UPDATE.notes) : 'Klik Update untuk memuat versi terbaru.') + '</div>'
    +       '<div class="text-[10px] opacity-70 mt-0.5">Anda pakai v' + escapeHTML(APP_VERSION) + ' → tersedia v' + escapeHTML(UPDATE.latestVersion) + '</div>'
    +     '</div>'
    +     '<div class="flex gap-2 items-center">'
    +       '<button onclick="applyUpdate()" class="h-10 px-4 rounded-xl bg-white text-teal-700 font-extrabold text-[12px] hover:bg-teal-50 shadow-lg flex items-center gap-1.5">'
    +         ico("download", 14) + ' Update Sekarang'
    +       '</button>'

    +         'Nanti'

    +         ico("x", 14)
    +       '</button>'
    +     '</div>'

    + '</div>'
    + '</div>';
}

window.doLogin = function() {
  var uEl = document.getElementById("loginUser");
  var pEl = document.getElementById("loginPass");
  if (!uEl || !pEl) return;
  var u = String(uEl.value || "").trim().toLowerCase();
  var p = String(pEl.value || "").trim();
  if (!u || !p) { showToast("Isi username dan password", "err"); return; }
  var user = app.users.find(function(x) {
    return String(x.username || "").trim().toLowerCase() === u && String(x.password || "").trim() === p;
  });
  if (!user) {
    user = USERS_DEFAULT.find(function(x) { return x.username.toLowerCase() === u && x.password === p; });
    if (user) {
      if (!app.users.some(function(x){ return String(x.username).toLowerCase() === user.username.toLowerCase(); })) {
        app.users.push(user); persist(); autoPush("sync_users", app.users);
      }
    }
  }
  if (!user) { showToast("❌ Username atau password salah", "err"); return; }
  if (user.status === "pending") {
    showToast("⏳ Akun masih menunggu approval " + (user.role === "walikelas" ? "Admin" : "Wali Kelas/Admin"), "err");
    return;
  }
  if (user.status === "rejected") { showToast("❌ Pendaftaran Anda ditolak. Hubungi admin.", "err"); return; }
  app.currentUser = user; app.page = "dashboard";
  persist();
  showToast("Selamat datang, " + user.name, "ok");
  render();
  if (SYNC.autoPull && SYNC.url && SYNC.url.indexOf("GANTI_") !== 0) {
    setTimeout(function() { syncPull(true).then(function(ok) { if (ok) showToast("Data tersinkron ✓", "ok"); }); }, 300);
  }
  startAutoSync();
};

window.doRegister = function() {
  var rf = app.regForm;
  if (!rf) { showToast("Form tidak ditemukan", "err"); return; }
  if (!rf.nama || !rf.username || !rf.password || !rf.noHP) { showToast("Lengkapi field bertanda *", "err"); return; }
  if (rf.username.length < 3) { showToast("Username min. 3 karakter", "err"); return; }
  if (rf.password.length < 6) { showToast("Password min. 6 karakter", "err"); return; }

  var uname = String(rf.username).toLowerCase().trim().replace(/\s/g, "");
  if (app.users.some(function(u) { return String(u.username).toLowerCase() === uname; })) { showToast("❌ Username sudah digunakan", "err"); return; }
  if (app.users.some(function(u) { return u.noHP && normalizePhone(u.noHP) === normalizePhone(rf.noHP); })) { showToast("❌ No. HP sudah digunakan", "err"); return; }

  var santriId = "";
  var guruId = "";
  var userKelas = "";
  var normalizedHP = normalizePhone(rf.noHP);
  var pendingSantri = null;

  if (rf.role === "walisantri") {
    if (rf.santriMode === "lama") {
      if (!rf.existingSantriId) { showToast("Pilih santri terlebih dahulu", "err"); return; }
      var existing = app.santri.find(function(s){ return s.id === rf.existingSantriId; });
      if (!existing) { showToast("Santri tidak ditemukan", "err"); return; }

      var akunExisting = santriSudahPunyaWali(rf.existingSantriId);
      if (akunExisting) {
        var statusAkun = akunExisting.status === "pending" ? "sedang menunggu approval" : (akunExisting.status === "approved" ? "sudah aktif" : "ditolak");
        showToast("❌ Santri " + existing.nama + " sudah terhubung ke akun @" + akunExisting.username + " (" + statusAkun + "). 1 santri hanya boleh 1 akun wali.", "err");
        return;
      }

      santriId = existing.id;
      userKelas = existing.kelas;
    } else {
      if (!rf.anakNama) { showToast("Nama anak wajib diisi", "err"); return; }
      pendingSantri = {
        nama: rf.anakNama,
        kelas: rf.anakKelas || "A1",
        kelamin: rf.anakJK || "Laki-laki",
        tglLahir: rf.anakTglLahir || "",
        goldar: rf.anakGoldar || "-",
        orangTua: rf.nama,
        wa: normalizedHP,
        alamat: rf.anakAlamat || "",
        status: "Aktif",
        progress: 0
      };
      userKelas = pendingSantri.kelas;
    }
  }

  if (rf.role === "walikelas") {
    guruId = nextIdMax(app.guru, "G");
    var guruBaru = {
      id: guruId,
      nama: rf.nama,
      kelas: rf.kelas || "A1",
      jk: "L",
      tglLahir: "",
      jabatan: "Wali Kelas",
      pendidikan: "-",
      noHP: normalizedHP,
      status: "Aktif"
    };
    app.guru.push(guruBaru);
    userKelas = guruBaru.kelas;
  }

  var newUser = {
    username: uname,
    password: rf.password,
    name: rf.nama,
    role: rf.role,
    kelas: userKelas,
    santriId: santriId,
    pendingSantri: pendingSantri,
    email: "",
    noHP: normalizedHP,
    status: "pending",
    createdAt: nowISO(),
    approvedBy: ""
  };
  app.users.push(newUser);
  persist();

  if (rf.role === "walikelas" && guruId) {
    autoPush("sync_guru", app.guru);
  }
  autoPush("sync_users", app.users);

  var approver = rf.role === "walikelas" ? "Admin" : "Wali Kelas / Admin";
  var extraMsg = (rf.role === "walisantri" && pendingSantri)
    ? " ID santri akan dibuat setelah disetujui."
    : "";
  showToast("✅ Pendaftaran berhasil! Tunggu approval dari " + approver + "." + extraMsg, "ok");
  app.regForm = null;
  app.loginMode = "username";
  render();
};

      +   '<button onclick="goPage(\'masukan\')" class="h-9 px-3 rounded-xl bg-white text-pink-600 text-[11px] font-bold flex items-center gap-1">' + ico("plus", 12) + ' Kirim</button></div>'
      + '</div>';
  }

  var aktif = app.santri.filter(function(s) { return s.status === "Aktif"; }).length;
  var todayData = app.presensiSantri[app.presensiDate] || {};
  var alphaToday = 0;
  Object.keys(todayData).forEach(function(id) { if (todayData[id].status === "alpa") alphaToday++; });
  var totalMasukanBaru = app.masukan.filter(function(m){ 
    if (user.role === "walikelas" && user.kelas && m.kelas !== user.kelas) return false;
    return m.status === "Baru"; 
  }).length;
  var mutTotalJamaah = 0, mutTotalMunfarid = 0, mutTotalTidak = 0, mutTotalBelum = 0, mutTotalSantri = 0, mutBacaYa = 0;
  app.santri.forEach(function(s) {
    var d = getMutabaahDay(s.id, todayISO());
    var c = countMutabaahDay(d);
    mutTotalJamaah += c.jamaah; mutTotalMunfarid += c.munfarid; mutTotalTidak += c.tidak; mutTotalBelum += c.belum;
    if (c.bacaSudah) mutBacaYa++;
    if (c.jamaah + c.munfarid + c.tidak > 0 || c.bacaSudah || c.bacaBelum) mutTotalSantri++;
  });
  var pendingApprovalCount = countPendingApproval();

  return '<div class="space-y-5">'
    + '<div class="flex items-center justify-between flex-wrap gap-2"><h1 class="text-[24px] font-extrabold text-gray-900">Dashboard</h1><div class="realtime-clock text-[11px] font-bold text-[#0F766E] bg-white px-3 py-1.5 rounded-full border">⏰ Loading...</div></div>'
    + '<div class="grid grid-cols-2 md:grid-cols-4 gap-3">'
    +   statCard("Total Santri", app.santri.length, "bg-[#0F766E]")

    + '</div>'

    + '<div class="bg-gradient-to-br from-teal-500 to-cyan-600 rounded-2xl p-4 text-white shadow-lg">'
    +   '<div class="flex items-center justify-between flex-wrap gap-2 mb-3">'
    +     '<div class="flex items-center gap-3"><span class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center">' + ico("mosques", 22) + '</span><div><div class="font-bold text-[14px]">🕌 Mutabaah — Hari Ini</div><div class="text-[10px] opacity-90">' + isoToDisplay(todayISO()) + ' · ' + mutTotalSantri + '/' + app.santri.length + ' santri terisi</div></div></div>'
    +     '<button onclick="goPage(\'mutabaah\')" class="h-8 px-3 rounded-lg bg-white/20 hover:bg-white/30 text-[11px] font-bold">Lihat</button>'
    +   '</div>'
    +   '<div class="grid grid-cols-5 gap-2">'
    +     '<div class="bg-white/15 rounded-xl p-2.5 text-center"><div class="text-[10px] opacity-80 mb-0.5">Jamaah</div><div class="text-[16px] font-extrabold">' + mutTotalJamaah + '</div></div>'
    +     '<div class="bg-white/15 rounded-xl p-2.5 text-center"><div class="text-[10px] opacity-80 mb-0.5">Sendiri</div><div class="text-[16px] font-extrabold">' + mutTotalMunfarid + '</div></div>'
    +     '<div class="bg-white/15 rounded-xl p-2.5 text-center"><div class="text-[10px] opacity-80 mb-0.5">Tidak</div><div class="text-[16px] font-extrabold">' + mutTotalTidak + '</div></div>'
    +     '<div class="bg-white/15 rounded-xl p-2.5 text-center"><div class="text-[10px] opacity-80 mb-0.5">📖 Baca</div><div class="text-[16px] font-extrabold">' + mutBacaYa + '</div></div>'
    +     '<div class="bg-white/25 rounded-xl p-2.5 text-center border-2 border-white/30"><div class="text-[10px] opacity-90 mb-0.5">Belum</div><div class="text-[16px] font-extrabold">' + mutTotalBelum + '</div></div>'
    +   '</div>'
    + '</div>'
    + (totalMasukanBaru > 0 ? '<div class="bg-gradient-to-r from-pink-500 to-rose-500 rounded-2xl p-4 text-white flex flex-wrap items-center justify-between gap-3 shadow-lg"><div class="flex items-center gap-3"><span class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center">' + ico("message", 20) + '</span><div><div class="font-bold text-[13px]">📬 Ada ' + totalMasukanBaru + ' masukan baru!</div></div></div><button onclick="goPage(\'masukan\')" class="h-9 px-3 rounded-xl bg-white text-pink-600 text-[11px] font-bold">Lihat</button></div>' : '')
    + '<div class="bg-white rounded-2xl border p-4"><div class="font-bold text-[13px] mb-3">Santri per Kelas</div><div class="space-y-3">' 
    + KELAS_LIST.map(function(k) {
        var items = app.santri.filter(function(s) { return s.kelas === k; });
        var pct = app.santri.length > 0 ? Math.round(items.length / app.santri.length * 100) : 0;
        return '<div><div class="flex justify-between text-[12px] mb-1"><span class="font-medium text-gray-700">Kelas ' + k + '</span><span class="text-gray-500">' + items.length + ' santri</span></div><div class="h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-[#0F766E] to-teal-400 rounded-full" style="width:' + pct + '%"></div></div></div>';
      }).join("")
    + '</div></div></div>';
}

}

window.approveUser = function(username) {
  var u = app.users.find(function(x) { return x.username === username; });
  if (!u) return;
  if (app.currentUser.role === "walikelas") {
    if (u.role !== "walisantri") { showToast("Anda hanya bisa approve Wali Santri", "err"); return; }
    var myKelas = String(app.currentUser.kelas || "").trim();
    if (!myKelas) { showToast("Akun Anda belum punya kelas", "err"); return; }
    var uKelas = getTargetKelasForUser(u);
    if (uKelas !== myKelas) { showToast("❌ Wali Santri ini bukan kelas " + myKelas, "err"); return; }
  }

  if (u.role === "walisantri" && u.santriId) {
    var akunLain = app.users.find(function(x) {
      return x.username !== u.username
        && x.role === "walisantri"
        && x.santriId === u.santriId
        && x.status === "approved";
    });
    if (akunLain) {
      showToast("❌ Gagal approve: santri ini sudah terhubung ke akun @" + akunLain.username + " yang aktif.", "err");
      return;
    }
  }

  var newSantriId = "";
  if (u.role === "walisantri" && u.pendingSantri && !u.santriId) {
    newSantriId = generateSantriId();
    var santriBaru = {
      id: newSantriId,
      nama: u.pendingSantri.nama,
      kelas: u.pendingSantri.kelas || "A1",
      kelamin: u.pendingSantri.kelamin || "Laki-laki",
      tglLahir: u.pendingSantri.tglLahir || "",
      goldar: u.pendingSantri.goldar || "-",
      orangTua: u.pendingSantri.orangTua || u.name,
      wa: u.pendingSantri.wa || u.noHP,
      alamat: u.pendingSantri.alamat || "",
      status: "Aktif",
      progress: 0
    };
    app.santri.push(santriBaru);
    if (!app.pencapaian[newSantriId]) app.pencapaian[newSantriId] = { surat: [], doa: [], bacaan: [], tugas: [] };
    u.santriId = newSantriId;
    u.kelas = santriBaru.kelas;
    delete u.pendingSantri;
    autoPush("sync_santri", app.santri);
    autoPush("sync_pencapaian", app.pencapaian);
  }

  u.status = "approved";
  u.approvedBy = app.currentUser.name;
  u.approvedAt = nowISO();
  persist();
  autoPush("sync_users", app.users);
  var msgExtra = newSantriId ? " (ID santri: " + newSantriId + ")" : "";
  showToast("✅ Akun " + u.name + " disetujui" + msgExtra, "ok");
  render();
};
window.rejectUser = function(username) {
  var u = app.users.find(function(x) { return x.username === username; });
  if (!u) return;
  if (app.currentUser.role === "walikelas") {
    if (u.role !== "walisantri") { showToast("Hanya bisa tolak Wali Santri", "err"); return; }
    var myKelas = String(app.currentUser.kelas || "").trim();
    var uKelas = getTargetKelasForUser(u);
    if (uKelas !== myKelas) { showToast("Bukan kelas Anda", "err"); return; }
  }
  if (!confirm("Tolak pendaftaran " + u.name + "?")) return;
  u.status = "rejected";
  u.rejectedBy = app.currentUser.name;
  persist(); autoPush("sync_users", app.users);
  showToast("Pendaftaran " + u.name + " ditolak", "ok");
  render();
};
window.deleteUserPending = function(username) {
  var u = app.users.find(function(x) { return x.username === username; });
  if (!u) return;
  var hasPending = u.role === "walisantri" && u.pendingSantri;
  var hasSantri = u.role === "walisantri" && u.santriId;
  var msg = "Hapus permanen akun ini?";
  if (hasPending) msg += "\n\nData santri baru yang belum di-approve juga akan dihapus.";
  if (hasSantri) msg += "\n\n⚠️ HATI-HATI: ini juga akan menghapus data santri " + u.santriId + "!";
  if (!confirm(msg)) return;

  app.users = app.users.filter(function(x) { return x.username !== username; });

  if (u.santriId) {
    app.santri = app.santri.filter(function(s) { return s.id !== u.santriId; });
    delete app.pencapaian[u.santriId];
    delete app.mutabaah[u.santriId];
    autoPush("sync_santri", app.santri);
    autoPush("sync_pencapaian", app.pencapaian);
  }

  persist(); autoPush("sync_users", app.users);
  showToast("Akun dihapus", "ok");
  render();
};

function renderApproval() {
  var user = app.currentUser;
  if (user.role !== "admin" && user.role !== "walikelas") {
    return '<div class="err-box">⚠️ Akses ditolak</div>';
  }

  var myKelas = String(user.kelas || "").trim();

  var canApprove = function(u) {
    if (u.status !== "pending") return false;
    if (user.role === "admin") return true;
    if (user.role === "walikelas") {
      if (u.role !== "walisantri") return false;
      if (!myKelas) return false;
      return getTargetKelasForUser(u) === myKelas;
    }
    return false;
  };

  var canView = function(u) {
    if (user.role === "admin") return u.role !== "admin";
    if (user.role === "walikelas") {
      if (u.role !== "walisantri") return false;
      if (!myKelas) return false;
      return getTargetKelasForUser(u) === myKelas;
    }
    return false;
  };

  var pendingList = app.users.filter(canApprove);
  var historyList = app.users.filter(function(u) {
    if (u.status !== "approved" && u.status !== "rejected") return false;
    return canView(u);
  });

  var pendingWalikelas = pendingList.filter(function(u) { return u.role === "walikelas"; });
  var pendingWalisantri = pendingList.filter(function(u) { return u.role === "walisantri"; });

  var renderUserCard = function(u, isPending) {
    var s = u.santriId ? app.santri.find(function(x) { return x.id === u.santriId; }) : null;
    var ps = u.pendingSantri || null;
    var statusBadge = "";
    if (u.status === "pending")  statusBadge = '<span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 text-[10px] font-bold">⏳ PENDING</span>';
    if (u.status === "approved") statusBadge = '<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-[10px] font-bold">✓ APPROVED</span>';
    if (u.status === "rejected") statusBadge = '<span class="px-2 py-0.5 rounded-full bg-red-100 text-red-700 text-[10px] font-bold">✗ REJECTED</span>';

    var roleBadgeColor = u.role === "walikelas" ? "bg-purple-100 text-purple-700" : "bg-blue-100 text-blue-700";
    var displayKelas = u.kelas || (s ? s.kelas : "") || (ps ? ps.kelas : "") || "-";

    return '<div class="bg-white rounded-2xl border p-4 shadow-sm space-y-2">'
      + '<div class="flex items-start justify-between gap-2 flex-wrap"><div class="flex-1 min-w-0">'
      +   '<div class="flex items-center gap-2 flex-wrap mb-1">'
      +     '<span class="font-bold text-[14px]">' + escapeHTML(u.name) + '</span>'
      +     '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold ' + roleBadgeColor + '">' + escapeHTML(u.role) + '</span>'
      +     '<span class="px-2 py-0.5 rounded-full bg-teal-100 text-teal-700 text-[10px] font-bold">Kelas ' + escapeHTML(displayKelas) + '</span>'
      +     statusBadge
      +   '</div>'
      +   '<div class="text-[11px] text-gray-600 space-y-0.5">'
      +     '<div>👤 <b>@' + escapeHTML(u.username) + '</b></div>'
      +     (u.noHP ? '<div>📱 ' + escapeHTML(formatPhoneDisplay(u.noHP)) + '</div>' : '')
      +     (u.createdAt ? '<div>🕐 Daftar: ' + fmtTime(u.createdAt) + '</div>' : '')
      +     (u.approvedBy ? '<div>✓ Di-approve oleh: <b>' + escapeHTML(u.approvedBy) + '</b></div>' : '')
      +   '</div>'
      + '</div></div>'
      + (s ? '<div class="bg-teal-50 border border-teal-200 rounded-xl p-2 text-[11px]">'
            + '<div class="font-bold text-teal-700 mb-0.5">👦 Data Anak (Terdaftar)</div>'
            + '<div><b>' + escapeHTML(s.nama) + '</b> · Kelas ' + escapeHTML(s.kelas) + ' · ' + escapeHTML(s.kelamin) + '</div>'
            + '<div class="text-gray-500 font-mono text-[10px]">ID: ' + escapeHTML(s.id) + '</div>'
            + '</div>' : '')
      + (ps ? '<div class="bg-amber-50 border border-amber-200 rounded-xl p-2 text-[11px]">'
            + '<div class="font-bold text-amber-700 mb-0.5">🆕 Data Anak Baru (ID dibuat saat di-approve)</div>'
            + '<div><b>' + escapeHTML(ps.nama) + '</b> · Kelas ' + escapeHTML(ps.kelas) + ' · ' + escapeHTML(ps.kelamin) + '</div>'
            + (ps.tglLahir ? '<div class="text-gray-500">Lahir: ' + escapeHTML(isoToDisplay(ps.tglLahir)) + '</div>' : '')
            + '<div class="text-amber-700 mt-1 italic">ID santri akan otomatis dibuat setelah Anda klik Setujui.</div>'
            + '</div>' : '')
      + (isPending
          ? '<div class="flex gap-2 pt-1">'
            + '<button onclick="approveUser(\'' + u.username + '\')" class="flex-1 h-10 rounded-xl bg-emerald-600 text-white font-bold text-[12px] hover:bg-emerald-700">✓ Setujui' + (ps ? ' & Buat ID' : '') + '</button>'
            + '<button onclick="rejectUser(\'' + u.username + '\')" class="flex-1 h-10 rounded-xl bg-red-50 text-red-600 font-bold text-[12px] hover:bg-red-100">✗ Tolak</button>'
            + '</div>'
          : '<button onclick="deleteUserPending(\'' + u.username + '\')" class="w-full h-9 rounded-xl bg-gray-50 text-gray-500 font-bold text-[11px] hover:bg-red-50 hover:text-red-600">🗑️ Hapus Akun</button>')
      + '</div>';
  };

  var infoBox = "";
  if (user.role === "admin") {

  } else {
    infoBox = '<div class="bg-blue-50 border border-blue-200 rounded-xl p-3 text-[11px] text-blue-800 flex items-start gap-2">' + ico("info", 14, "shrink-0 mt-0.5")
      + ' <span>Anda dapat menyetujui <b>Wali Santri kelas ' + escapeHTML(myKelas || "(belum diset)") + '</b>. Santri baru akan dibuatkan ID otomatis saat Anda approve. <b>1 santri = 1 akun wali</b>.</span></div>';
  }

  return '<div class="space-y-4">'
    + '<div><h1 class="text-[24px] font-extrabold">Approval Akun</h1><p class="text-[12px] text-gray-500">'
    + (user.role === "admin" ? 'Semua pendaftar · Wali Kelas & Wali Santri' : 'Wali Santri kelas ' + escapeHTML(myKelas || "-"))
    + '</p></div>'
    + infoBox
    + '<div class="grid grid-cols-2 gap-3">'
    +   '<div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-center"><div class="text-2xl font-extrabold text-amber-600">' + pendingList.length + '</div><div class="text-[10px] font-bold text-amber-700">MENUNGGU APPROVAL</div></div>'
    +   '<div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-center"><div class="text-2xl font-extrabold text-emerald-600">' + historyList.filter(function(u){ return u.status === "approved"; }).length + '</div><div class="text-[10px] font-bold text-emerald-700">SUDAH DISETUJUI</div></div>'
    + '</div>'
    + (pendingList.length === 0
        ? '<div class="bg-emerald-50 border border-emerald-200 rounded-xl p-6 text-center"><div class="text-3xl mb-2">✅</div><div class="font-bold text-emerald-800">Tidak ada pendaftar baru</div><div class="text-[11px] text-emerald-700">Semua pendaftaran sudah diproses.</div></div>'
        : (user.role === "admin"
            ? ((pendingWalikelas.length > 0
                  ? '<div class="bg-purple-50 border border-purple-200 rounded-xl p-3 flex items-center gap-2 mb-2"><span class="w-6 h-6 rounded-lg bg-purple-500 text-white flex items-center justify-center text-[10px] font-bold">WK</span><div class="font-bold text-[12px] text-purple-800">👨‍🏫 Wali Kelas (' + pendingWalikelas.length + ')</div></div>'
                    + '<div class="space-y-3 mb-4">' + pendingWalikelas.map(function(u) { return renderUserCard(u, true); }).join("") + '</div>'

function renderMutabaah() {
  var user = app.currentUser;
  var mySantri = getMySantri();
  if (user.role === "walisantri") {
    if (!mySantri) return '<div class="space-y-4"><h1 class="text-[24px] font-extrabold">Mutabaah</h1><div class="bg-amber-50 border border-amber-200 text-amber-800 p-6 rounded-2xl text-center"><div class="font-bold">Akun belum terhubung ke data santri</div></div></div>';
    var date = app.mutabaahDate || todayISO();
    var dayData = getMutabaahDay(mySantri.id, date);
    var c = countMutabaahDay(dayData);
    var waktuRows = WAKTU_SHOLAT.map(function(w) {
      var cur = dayData[w.k] || "";

window.onFilterMasukan = function(k, v) { app.filterMasukan[k] = v; renderKeepScroll(); };
window.openMasukanForm = function() { app.modal = { type: "masukanForm", data: { kategori: "Saran", isi: "" } }; renderModal(); };
window.saveMasukan = function() {
  var g = function(id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; };
  var m = app.modal;
  if (!m || m.type !== "masukanForm") return;
  var isi = g("f_masukan_isi"); var kategori = g("f_masukan_kategori");
  if (!isi || isi.length < 5) { showToast("Isi minimal 5 karakter", "err"); return; }
  var mySantri = getMySantri(); var user = app.currentUser;
  var entry = { id: "M" + Date.now(), tanggal: nowISO(), pengirim: user.name, username: user.username, santriId: mySantri ? mySantri.id : "", santriNama: mySantri ? mySantri.nama : "", kelas: mySantri ? mySantri.kelas : "", kategori: kategori, isi: isi, status: "Baru", balasan: "", tanggalBalasan: "", dibacaOleh: "", dibalasOleh: "" };
  app.masukan.unshift(entry);
  persist(); autoPush("sync_masukan", app.masukan);
  showToast("✅ Masukan terkirim", "ok");
  app.modal = null; renderModal(); render();
};
window.openMasukanDetail = function(id) {
  var item = app.masukan.find(function(x){ return x.id === id; });
  if (!item) return;
  if (app.currentUser.role === "walisantri" && item.username !== app.currentUser.username) {
    showToast("🔒 Akses ditolak", "err"); return;
  }
  if ((app.currentUser.role === "admin" || app.currentUser.role === "walikelas") && item.status === "Baru") {
    item.status = "Dibaca"; item.dibacaOleh = app.currentUser.name;
    persist(); autoPush("sync_masukan", app.masukan);
  }
  if (app.currentUser.role === "walisantri" && item.username === app.currentUser.username) { item._seenByWali = true; persist(); }
  app.modal = { type: "masukanDetail", data: item };
  renderModal(); render();
};
window.saveBalasanMasukan = function() {
  var g = function(id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; };
  var m = app.modal;
  if (!m || m.type !== "masukanDetail") return;
  var balasan = g("f_masukan_balasan");
  if (!balasan) { showToast("Tulis balasan dulu", "err"); return; }
  var item = app.masukan.find(function(x){ return x.id === m.data.id; });
  if (!item) return;
  item.balasan = balasan; item.tanggalBalasan = nowISO(); item.status = "Dibalas"; item.dibalasOleh = app.currentUser.name;
  persist(); autoPush("sync_masukan", app.masukan);
  showToast("✅ Balasan tersimpan", "ok");
  app.modal = { type: "masukanDetail", data: item };
  renderModal(); render();
};
window.deleteMasukan = function(id) {
  if (!confirm("Hapus masukan ini?")) return;
  app.masukan = app.masukan.filter(function(x){ return x.id !== id; });
  persist(); autoPush("sync_masukan", app.masukan); showToast("Dihapus", "ok"); app.modal = null; renderModal(); render();
};

function renderMasukan() {
  var user = app.currentUser;
  if (user.role === "walisantri") {
    var list = app.masukan.filter(function(m){ return m.username === user.username; });
    var rows = list.map(function(m) {
      return '<div class="p-3 border-t hover:bg-gray-50 cursor-pointer" onclick="openMasukanDetail(\'' + m.id + '\')"><div class="flex items-center gap-2 flex-wrap mb-1">' + masukanKategoriBadge(m.kategori) + masukanStatusBadge(m.status) + '<span class="text-[10px] text-gray-400 ml-auto">' + fmtTime(m.tanggal) + '</span></div><p class="text-[12px] line-clamp-2">' + escapeHTML(m.isi) + '</p>' + (m.balasan ? '<div class="mt-2 bg-emerald-50 rounded p-2 text-[11px]">💬 ' + escapeHTML(m.balasan) + '</div>' : '') + '</div>';
    }).join("");
    if (list.length === 0) rows = '<div class="p-8 text-center text-gray-400 text-xs">Belum ada masukan.</div>';
    return '<div class="space-y-4">'
      + '<h1 class="text-[24px] font-extrabold">Masukan & Saran</h1>'
      + '<div class="bg-gradient-to-br from-pink-500 to-rose-500 rounded-2xl p-4 text-white shadow-lg"><div class="font-bold">Sampaikan Masukan Anda</div><button onclick="openMasukanForm()" class="mt-3 h-9 px-4 rounded-xl bg-white text-pink-600 font-bold text-[12px]">➕ Tulis</button></div>'
      + '<div class="bg-white rounded-2xl border overflow-hidden shadow-sm"><div class="p-3 bg-gray-50 border-b font-bold text-[13px]">📨 Riwayat (' + list.length + ')</div><div>' + rows + '</div></div></div>';
  }
  var f = app.filterMasukan;
  var filtered = app.masukan.filter(function(m) {
    if (f.status !== "Semua" && m.status !== f.status) return false;
    if (f.q && (m.isi + " " + m.pengirim).toLowerCase().indexOf(f.q.toLowerCase()) === -1) return false;
    if (user.role === "walikelas" && user.kelas && m.kelas !== user.kelas) return false;
    return true;
  });
  var rows = filtered.map(function(m) {
    return '<div class="p-3 border-t hover:bg-gray-50 cursor-pointer" onclick="openMasukanDetail(\'' + m.id + '\')"><div class="flex items-center gap-2 flex-wrap mb-1"><span class="font-medium text-[12px]">' + escapeHTML(m.pengirim) + '</span>' + masukanKategoriBadge(m.kategori) + masukanStatusBadge(m.status) + '<span class="text-[10px] text-gray-400 ml-auto">' + fmtTime(m.tanggal) + '</span></div><p class="text-[12px] line-clamp-2">' + escapeHTML(m.isi) + '</p></div>';
  }).join("");
  if (filtered.length === 0) rows = '<div class="p-8 text-center text-gray-400 text-xs">Belum ada masukan</div>';
  var statusOpts = ["Semua"].concat(STATUS_MASUKAN).map(function(s){ return '<option value="' + s + '"' + (f.status === s ? " selected" : "") + '>' + (s === "Semua" ? "Semua Status" : s) + '</option>'; }).join("");
  return '<div class="space-y-4">'
    + '<h1 class="text-[24px] font-extrabold">Masukan & Saran</h1>'
    + '<div class="bg-white rounded-2xl border p-4 flex gap-2"><select onchange="onFilterMasukan(\'status\',this.value)" class="h-10 px-3 rounded-xl border text-sm flex-1">' + statusOpts + '</select></div>'
    + '<div class="bg-white rounded-2xl border overflow-hidden shadow-sm"><div class="p-3 bg-gray-50 border-b font-bold text-[13px]">📬 Daftar</div><div>' + rows + '</div></div></div>';
}

function modalRekapBulananHTML() {
  var now = new Date();
  var rekap = {};
  app.santri.forEach(function(s){ rekap[s.id] = { nama: s.nama, kelas: s.kelas, hadir: 0, izin: 0, sakit: 0, alpa: 0, total: 0 }; });
  Object.keys(app.presensiSantri || {}).forEach(function(tgl) {
    var d = new Date(tgl);
    if (d.getMonth() !== now.getMonth() || d.getFullYear() !== now.getFullYear()) return;
    var day = app.presensiSantri[tgl];
    Object.keys(day).forEach(function(id) {
      if (!rekap[id]) return;
      rekap[id].total++;
      var st = day[id].status;
      if (rekap[id][st] !== undefined) rekap[id][st]++;
    });
  });
  var rows = Object.keys(rekap).map(function(id) {
    var r = rekap[id];
    if (r.total === 0) return "";
    var pct = r.total > 0 ? Math.round(r.hadir / r.total * 100) : 0;
    return '<tr><td>' + escapeHTML(r.nama) + '</td><td class="text-center">' + r.hadir + '</td><td class="text-center">' + r.izin + '</td><td class="text-center">' + r.sakit + '</td><td class="text-center">' + r.alpa + '</td><td class="text-center font-bold">' + pct + '%</td></tr>';

  var w = window.open("", "_blank");
  if (!w) { showToast("Popup diblokir. Izinkan popup untuk mencetak.", "err"); return; }
  w.document.open();

function renderPencapaian() {
  var user = app.currentUser;

  if (user.role === "walisantri") {
    var mySantri = getMySantri();
    if (!mySantri) {
      return '<div class="bg-amber-50 border border-amber-200 text-amber-800 p-6 rounded-2xl text-center">'
        + '<div class="font-bold">Akun belum terhubung ke data santri</div></div>';
    }
    return '<div class="space-y-4">'
      + '<div class="flex items-center justify-between flex-wrap gap-2">'
      +   '<h1 class="text-[24px] font-extrabold">Pencapaian Anak Saya</h1>'
      +   '<button onclick="printPencapaian(\'' + mySantri.id + '\')" class="h-10 px-4 rounded-xl bg-[#0F766E] text-white font-bold flex items-center gap-2 text-[12px] shadow-md hover:bg-[#0e6b64]">' + ico("printer", 14) + ' Cetak</button>'
      + '</div>'
      + '<div class="bg-blue-50 border border-blue-200 rounded-xl p-3 text-[11px] text-blue-800 flex items-start gap-2">'
      +   ico("info", 14, "shrink-0 mt-0.5")
      +   ' <span>Anda hanya dapat melihat pencapaian anak Anda: <b>'
      +   escapeHTML(mySantri.nama) + '</b> (' + escapeHTML(mySantri.id) + ')</span>'
      + '</div>'
      + renderPencapaianAnakCard(mySantri)
      + '</div>';
  }

  var fk = app.filterPencapaian.kelas;
  var kelasTampil = fk === "all" ? KELAS_LIST : [fk];
  var groups = kelasTampil.map(function(k) {
    var items = app.santri.filter(function(s) {
      if (s.kelas !== k) return false;
      if (user.role === "walikelas" && user.kelas && s.kelas !== user.kelas) return false;
      return true;
    });
    var isOpen = app.openPencapaianKelas[k];
    var rows = items.length === 0 ? '<tr><td colspan="4" class="p-6 text-center text-gray-400 text-xs">Kosong</td></tr>'
      : items.map(function(s, i) {
          var p = getPencapaian(s.id);
          var h = p.surat.filter(function(x) { return x.status === "Hafal"; }).length;
          return '<tr class="cursor-pointer" onclick="openPencapaianDetail(\'' + s.id + '\')"><td>' + (i + 1) + '</td><td>' + escapeHTML(s.nama) + '</td><td class="text-center">📖 ' + h + '/' + p.surat.length + '</td><td class="text-center">📝 ' + (p.tugas || []).length + '</td></tr>';
        }).join("");
    var groupClass = k === "A1" ? "group-a1" : k === "A2" ? "group-a2" : k === "B" ? "group-b" : "group-c";
    return '<div class="bg-white rounded-2xl border overflow-hidden"><div onclick="togglePencapaianKelas(\'' + k + '\')" class="' + groupClass + ' p-2.5 flex items-center gap-2 cursor-pointer"><div class="w-8 h-8 rounded-lg bg-[#0F766E] text-white flex items-center justify-center font-extrabold text-xs">' + k + '</div><div class="flex-1"><div class="font-bold text-xs">Kelas ' + k + '</div></div><span class="' + (isOpen ? "rotate-180" : "") + ' transition-transform">' + ico("chevron", 14) + '</span></div>' + (isOpen ? '<div class="overflow-x-auto"><table class="data-table text-[12px]"><thead><tr><th>No</th><th>Nama</th><th>Surat</th><th>Tugas</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '') + '</div>';
  }).join("");
  return '<div class="space-y-3"><h1 class="text-[24px] font-extrabold">Pencapaian</h1><div class="space-y-2">' + groups + '</div></div>';
}

window.onFilterKas = function(k, v) { app.filterKas[k] = v; renderKeepScroll(); };
window.openKasModal = function(mode, id) {
  var data;
  if (mode === "edit" && id) { var e = app.kas.find(function(k){ return k.id === id; }); if (!e) return; data = JSON.parse(JSON.stringify(e)); }
  else data = { id: nextIdMax(app.kas, "K"), tanggal: todayISO(), jenis: "Pemasukan", kategori: "SPP", nominal: 0, ket: "" };
  app.modal = { type: "kas", mode: mode, data: data }; renderModal();
};
window.saveKas = function() {
  var g = function(id){ var e = document.getElementById(id); return e ? e.value.trim() : ""; };
  var m = app.modal; if (!m || m.type !== "kas") return;
  var data = { id: g("f_kas_id"), tanggal: g("f_kas_tanggal"), jenis: g("f_kas_jenis"), kategori: g("f_kas_kategori"), nominal: Number(g("f_kas_nominal")) || 0, ket: g("f_kas_ket") };
  // ⭐ push (bukan unshift) supaya data baru muncul di bawah
  if (m.mode === "add") app.kas.push(data); else app.kas = app.kas.map(function(k){ return k.id === data.id ? data : k; });
  persist(); autoPush("sync_kas", app.kas);
  app.modal = null; renderModal(); render();
};
window.deleteKas = function(id) {
  if (!confirm("Hapus?")) return;
  app.kas = app.kas.filter(function(k){ return k.id !== id; });
  persist(); autoPush("sync_kas", app.kas); render();
};

function renderKas() {
  var masuk = app.kas.filter(function(k){ return k.jenis === "Pemasukan"; }).reduce(function(a,k){ return a + (Number(k.nominal) || 0); }, 0);
  var keluar = app.kas.filter(function(k){ return k.jenis === "Pengeluaran"; }).reduce(function(a,k){ return a + (Number(k.nominal) || 0); }, 0);
  var saldo = masuk - keluar;

  // ⭐ Urutkan dari tanggal terlama → terbaru (data awal di atas)
  var kasSorted = app.kas.slice().sort(function(a, b) {
    var da = normalizeDateKey(a.tanggal) || "";
    var db = normalizeDateKey(b.tanggal) || "";
    if (da < db) return -1;
    if (da > db) return 1;
    return String(a.id || "").localeCompare(String(b.id || ""));
  });

  var rows = kasSorted.map(function(k){
    var cls = k.jenis === "Pemasukan" ? "bg-emerald-100 text-emerald-700" : "bg-red-100 text-red-700";

window.openAkunModal = function(mode, username) {
  var data;
  if (mode === "edit" && username) {
    var e = app.users.find(function(u) { return u.username === username; });
    if (!e) return;
    data = JSON.parse(JSON.stringify(e));
    if (!data.status) data.status = "approved";
  } else data = { username: "", password: "", name: "", role: "walikelas", kelas: "A1", santriId: "", noHP: "", status: "approved" };
  app.modal = { type: "akun", mode: mode, data: data };
  renderModal();
};
window.saveAkun = function() {
  var g = function(id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; };
  var m = app.modal;
  if (!m || m.type !== "akun") return;
  var data = { username: g("f_akun_username").toLowerCase().replace(/\s/g, ""), password: g("f_akun_password"), name: g("f_akun_name"), role: g("f_akun_role"), kelas: "", santriId: "", noHP: normalizePhone(g("f_akun_noHP")), email: "", status: m.data.status || "approved" };
  if (data.role === "walikelas") data.kelas = g("f_akun_kelas");
  if (data.role === "walisantri") data.santriId = g("f_akun_santriId");
  if (!data.username || !data.password || !data.name) { showToast("Lengkapi field", "err"); return; }

  if (data.role === "walisantri" && data.santriId) {
    var akunLain = santriSudahPunyaWali(data.santriId, m.data.username);
    if (akunLain) {
      showToast("❌ Santri ini sudah terhubung ke akun @" + akunLain.username + ". 1 santri hanya boleh 1 akun wali.", "err");
      return;
    }
  }

  if (m.mode === "add") {
    if (app.users.some(function(u) { return u.username.toLowerCase() === data.username; })) { showToast("Username sudah ada", "err"); return; }
    app.users.push(data);
  } else {
    app.users = app.users.map(function(u) { return u.username === m.data.username ? data : u; });
  }
  persist(); autoPush("sync_users", app.users);
  app.modal = null; renderModal(); render();
};
window.deleteAkun = function(username) {
  if (username === app.currentUser.username) { showToast("Tidak bisa hapus diri sendiri", "err"); return; }
  if (!confirm("Hapus akun?")) return;
  app.users = app.users.filter(function(x) { return x.username !== username; });
  persist(); autoPush("sync_users", app.users); render();
};

  } else el.innerHTML = "";

  var m = app.modal;
  try {
    if (m.type === "santri") el.innerHTML = modalSantriHTML(m);

    else if (m.type === "bacaan") el.innerHTML = modalBacaanHTML(m);
    else if (m.type === "hafalanSurat") el.innerHTML = modalHafalanSuratHTML(m);
    else if (m.type === "hafalanDoa") el.innerHTML = modalHafalanDoaHTML(m);
    else if (m.type === "tugas") el.innerHTML = modalTugasHTML(m);
    else if (m.type === "pencapaianDetail") el.innerHTML = modalPencapaianDetailHTML(m.santriId);
    else if (m.type === "accountList") el.innerHTML = modalAccountListHTML();
    else if (m.type === "kas") el.innerHTML = modalKasHTML(m);

// ============================================================
// RENDER UTAMA
// ============================================================
function render() {
  var root = document.getElementById("app");
  if (!root) return;
  var html = "";
  try {
    if (!app.currentUser) html = renderLogin();
    else html = renderLayout();
  } catch (e) {
    console.error("Render error:", e);
    html = '<div class="min-h-screen flex items-center justify-center p-4 bg-gray-50"><div class="bg-white rounded-2xl p-6 max-w-[480px]"><div class="text-4xl mb-2 text-center">⚠️</div><div class="font-bold text-center mb-3">Terjadi error</div><div class="err-box">' + escapeHTML(e.message) + '</div><button onclick="location.reload()" class="w-full h-10 rounded-xl bg-[#0F766E] text-white font-bold mt-3">Muat Ulang</button></div></div>';
  }
  html += renderUpdateBanner();
  html += '<div id="toasts" class="fixed top-4 right-4 z-[110] flex flex-col gap-2 pointer-events-none"></div>';
  html += '<div id="modal-root"></div>';
  root.innerHTML = html;
  renderModal();
  renderToasts();
  updateRealtimeClock();
  if (!app.currentUser) {
    setTimeout(function() {
      if (app.loginMode === "register") return;
      var el = document.getElementById("loginUser");
      if (el && LOGIN_SYNC.status !== "loading") el.focus();
    }, 50);
    var pE = document.getElementById("loginPass");
    if (pE && !pE._wired) { pE._wired = true; pE.addEventListener("keydown", function(e) { if (e.key === "Enter") doLogin(); }); }
    var uE = document.getElementById("loginUser");
    if (uE && !uE._wired) { uE._wired = true; uE.addEventListener("keydown", function(e) { if (e.key === "Enter") { var p = document.getElementById("loginPass"); if (p) p.focus(); } }); }
  }
}

// ============================================================
// INIT
// ============================================================
function init() {
  TODAY_ISO = todayISO();
  app.mutabaahDate = todayISO();
  render();

  document.addEventListener("blur", function(e) {
    var el = e.target;
    if (!el || !el.value) return;
    var id = el.id || "";
    var isPhoneInput = /noHP|wa$|_wa|phone/i.test(id) || el.type === "tel";
    if (isPhoneInput) {
      var formatted = normalizePhone(el.value);
      if (formatted) el.value = formatted;
    }
  }, true);

  if (!app.currentUser) setTimeout(function() { loginSyncAutoPull(); }, 100);
  if (app.currentUser && SYNC.autoPull && SYNC.url && SYNC.url.indexOf("GANTI_") !== 0) {
    setTimeout(function() { syncPull(true).then(function(ok) { if (ok) showToast("Data tersinkron ✓", "ok"); }); }, 500);
  }

  setTimeout(function() { checkForUpdate(true); }, 3000);
  setInterval(function() {
    if (document.hidden) return;
    checkForUpdate(true);
  }, VERSION_CHECK_INTERVAL_MS);

  setInterval(function(){
    var el = document.getElementById("countdownText");
    if (!el) return;
    var now = new Date();
    var target = new Date(); target.setHours(14, 0, 0, 0);
    if (now > target) target.setDate(target.getDate() + 1);
    var diff = target - now;
    el.textContent = Math.floor(diff / 3600000) + " jam " + Math.floor((diff % 3600000) / 60000) + " menit lagi (14:00 WIB)";
  }, 60000);
  setInterval(checkMidnightRollover, 30000);
  setInterval(updateRealtimeClock, 1000);
  updateRealtimeClock();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
